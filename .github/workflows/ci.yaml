name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages come from three other repositories, which CI packs into a
  # local feed. The engine branch with this branch's name is the pair when
  # there is one, so a change here and the engine change it needs build
  # together. Without one it uses the engine's default branch. The renderer
  # runs on macOS so far, so tests that need it skip elsewhere.
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-examples

      - id: engine
        shell: bash
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads \
              https://github.com/ChxisB/orblit.git "$branch" > /dev/null; then
            echo "Building against ChxisB/orblit@$branch"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "No matching engine branch; using its default"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      # No token: these repositories are public, so the default GITHUB_TOKEN
      # reads them. Nothing here needs a secret.
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit
          ref: ${{ steps.engine.outputs.ref }}
          path: orblit
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit-net
          path: orblit-net
      # The gallery's cloth moves with the physics repository's solver.
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit-physics
          path: orblit-physics

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: orblit-examples/dotnet/global.json

      # The runner context exists in a step and not in a job's env, so the
      # feed folder is named on each step that reads it.
      # The packages carry the native core only if it is built before they are
      # packed.
      - name: Build the engine natives
        shell: bash
        working-directory: orblit
        run: tool/build_native.sh

      - name: Pack the engine
        shell: bash
        working-directory: orblit
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: tool/pack_local.sh

      - name: Pack networking
        shell: bash
        working-directory: orblit-net
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: dotnet pack dotnet/Orblit.Net -c Release -o "${{ runner.temp }}/feed" --nologo -v q

      - name: Pack physics
        shell: bash
        working-directory: orblit-physics
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: |
          tool/build_native.sh
          dotnet pack dotnet/Orblit.Physics -c Release -o "${{ runner.temp }}/feed" --nologo -v q
          dotnet pack dotnet/Orblit.Physics.Soft -c Release -o "${{ runner.temp }}/feed" --nologo -v q

      - name: Check
        shell: bash
        working-directory: orblit-examples
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: tool/check_dotnet.sh

  # Checks each commit on a pull request against commitlint.config.mjs.
  # Pull requests only, since a push to main has no range to check. It
  # checks out the branch head, not the merge commit GitHub makes, so the
  # range holds the branch's own commits and nothing else.
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @commitlint/cli@21 --from "origin/$BASE_BRANCH" --to HEAD
        env:
          BASE_BRANCH: ${{ github.base_ref }}
