name: orblit_simulation_example
description: >-
  A headless slice through the whole engine: an ECS world with a transform
  hierarchy, a Dart system running over views, and the result replicated to a
  second world.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_codegen:
    git:
      url: https://github.com/Orblit-Engine/orblit.git
      path: packages/orblit_codegen
      ref: main
  orblit_core:
    git:
      url: https://github.com/Orblit-Engine/orblit.git
      path: packages/orblit_core
      ref: main
  orblit_net:
    git:
      url: https://github.com/Orblit-Engine/orblit-net.git
      ref: main

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
