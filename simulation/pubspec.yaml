name: orbis_simulation_example
description: >-
  A headless slice through the whole engine: an ECS world with a transform
  hierarchy, a Dart system running over views, and the result replicated to a
  second world.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orbis_codegen:
    git:
      url: git@github.com:Orbis-Engine/orbis.git
      path: packages/orbis_codegen
      ref: master
  orbis_core:
    git:
      url: git@github.com:Orbis-Engine/orbis.git
      path: packages/orbis_core
      ref: master
  orbis_net:
    git:
      url: git@github.com:Orbis-Engine/orbis-net.git
      ref: master

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
